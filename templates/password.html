{% extends 'base.html' %}{% block content %}<div class="page-heading">
    <div>
        <div class="eyebrow">SEGURIDAD</div>
        <h1>{{ 'Crea tu contraseña personal' if user.must_change else 'Cambiar contraseña' }}</h1>
        <p>Usa una contraseña de al menos 12 caracteres.</p>
    </div>
</div>
<form method="post" class="panel narrow"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Contraseña actual o
        temporal<input name="current" type="password" autocomplete="current-password" required></label><label>Nueva
        contraseña<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"
            required></label><label>Confirmar nueva contraseña<input name="confirm" type="password" minlength="12"
            maxlength="128" autocomplete="new-password" required></label><button class="primary">Guardar
        contraseña</button></form>{% endblock %}
